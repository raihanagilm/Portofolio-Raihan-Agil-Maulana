<!DOCTYPE html>
<html class="light" lang="id">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=5.0" name="viewport">
    <meta name="description" content="Manajemen Portofolio - Login Page dengan tema kardus">
    <title>Manajemen Portofolio - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        try {
            tailwind.config = {
                darkMode: "class",
                theme: {
                    extend: {
                        "colors": {
                            "kraft-light": "#F5E6D3",
                            "kraft": "#E8D4B8",
                            "kraft-dark": "#D4B896",
                            "cardboard": "#C9A87C",
                            "cardboard-dark": "#A67C52",
                            "cardboard-darker": "#8B5A3C",
                            "earth-brown": "#5C3214",
                            "earth-dark": "#2C1A0E",
                            "card-bg": "#FFFBF5",
                            "surface": "#FAF0E6",
                            "accent": "#D2691E",
                            "accent-hover": "#B8581A",
                            "on-surface": "#2C1A0E",
                            "on-primary": "#FFFFFF",
                            "border-card": "#8B5A3C",
                            "border-light": "#A67C52",
                            "text-muted": "#6E5033"
                        }
                    }
                }
            }
        } catch (_e) { }
    </script>
    <link rel="stylesheet" href="/css/style-base.css">
    <link rel="stylesheet" href="/css/style-login.css">
</head>

<body class="bg-surface text-earth-dark font-body-md min-h-screen flex flex-col justify-center items-center p-4">
    <main class="w-full max-w-md z-10 my-auto">
        <div class="cardboard-card cardboard-texture rounded-2xl p-6 sm:p-8 shadow-cardboard relative">
            <div class="tape-accent"></div>
            
            <div class="mb-6 text-center">
                <div class="inline-block mb-3">
                    <div class="w-16 h-16 sm:w-20 sm:h-20 bg-gradient-to-br from-cardboard-dark to-cardboard-darker rounded-2xl flex items-center justify-center shadow-md border-2 border-earth-dark">
                        <svg class="text-white text-3xl sm:text-4xl w-6 h-6 flex-shrink-0 object-contain"  xmlns="http://www.w3.org/2000/svg" fill="currentColor" aria-label="folder cog" viewBox="0 0 172 146"><path d="M20.3 7.9a14 14 0 0 0-9.8 7.8c-1.7 3.4-1.8 7-1.7 42.3.2 50.2 1 69.5 2.9 73.8 3.3 7 .2 6.7 75.8 6.7 63.8 0 68.2-.1 70.6-1.8 4.9-3.3 5-4.2 4.7-51.8-.3-40.2-.5-44.7-2.1-47.6-3.5-6.5-4.5-6.7-40.7-6.4-17.9.1-33.3-.1-34.3-.5-1-.3-3.5-4.1-5.7-8.3-4.1-8.2-6.8-11.2-11.5-13.2-3.5-1.5-43.1-2.3-48.2-1M68 14.6c2.6 1.4 4.5 3.9 7.1 9.3C81.3 36.5 77.6 35.4 118 36c34.7.5 35 .5 37.2 2.8l2.3 2.3.3 43.7c.3 42.4.3 43.9-1.6 46.3l-2 2.4-66.9-.3c-73.3-.4-70.7-.2-71.8-6.4-.3-1.8-.6-27-.8-56-.2-52.6-.2-52.7 1.9-54.9 3.4-3.3 7.5-3.8 28.4-3.6 17.5.2 19.9.5 23 2.3"/><path d="M77 55c-1.1 1.1-2 2.9-2 3.9 0 2.7-2.6 3.3-6.1 1.6-3.4-1.8-4.9-1.3-9.8 3.8-2.8 3-3.2 4-2.7 6.4 1.5 5.9 1.2 6.7-2.7 8.5l-3.8 1.9.3 7.2.3 7.2 3.9 1.8c4 1.9 4 2.1 2.1 8.3-.5 1.7.2 3.2 3 6.3 4.4 4.9 6.8 5.8 10 3.7 2.6-1.7 5.5-1.2 5.5 1.1 0 2.4 4.7 6.3 7.7 6.3 4.6 0 10.3-2 10.3-3.5 0-.8.9-2.4 1.9-3.4 1.9-1.9 2.2-1.9 5.1-.4 3 1.4 3.3 1.4 7-1.1q8.2-5.5 5.5-11-2.6-5 2.1-6.2 5.3-1.5 5.4-9.2c0-5.6-1.3-7.9-5.5-9.7-3.9-1.6-4.1-2.4-2.1-6.4 1.3-2.5 1.3-3.1-.2-5.2a23 23 0 0 0-8.4-7.4c-.9-.3-2.8.1-4.1 1q-4.8 3-6.2-2.6c-.8-3.5-3.6-4.9-10.1-4.9q-4.5 0-6.4 2m12.5 6.1c1 4.5 6.2 6.6 10.6 4.3 3.1-1.5 3.2-1.5 5.7.9 2.3 2.3 2.4 2.8 1.3 5.6-2 4.6 0 9.7 4.5 11.1 3.2 1.1 3.4 1.4 3.4 5.6 0 3.5-.3 4.4-1.8 4.4-4.5 0-9.1 7.5-6.3 10.3q2.8 3-1.7 6.4c-2.5 1.8-3.1 1.9-5.4.7-3.7-1.9-8.6.2-10.4 4.5-1.1 2.7-1.8 3.1-4.9 3.1s-3.7-.4-4.7-3c-1.4-4.3-6.8-6.6-10.7-4.5-2.7 1.3-3 1.2-5.5-1.4-2.7-2.8-2.7-3-1.2-5.3s1.5-2.8.1-6.2c-1.2-2.8-2.3-3.8-4.6-4.3-2.9-.5-3-.8-2.7-5.1.3-4 .6-4.7 2.8-5.2 3.2-.8 5.9-7.3 4.2-10.1-1.8-2.9-1.4-4.6 1.5-6.7 2.4-1.7 2.9-1.8 5.2-.4s3 1.3 6.3-.1c2.7-1.1 3.8-2.3 4.3-4.6.6-2.9 1-3.1 5-3.1s4.4.2 5 3.1"/><path d="M80.4 75.6a13 13 0 0 0-5.8 21.3c7.9 9.4 23.4 3.9 23.4-8.4 0-4.8-1.6-8.1-5-10.7a13 13 0 0 0-12.6-2.2m10.4 6.6c2.2 2.1 2.9 6.8 1.6 10.3-.8 1.9-5.5 4.5-8.4 4.5-1.2 0-3.5-1.3-5.1-2.9-8.3-8.4 3.2-19.9 11.9-11.9"/></svg>
                    </div>
                </div>
                <h1 class="font-bold text-2xl sm:text-3xl text-earth-dark mb-1">Manajemen Portofolio</h1>
                <p class="text-text-muted text-xs sm:text-sm font-medium">Masuk untuk mengelola portofolio Raihan Agil Maulana.</p>
            </div>

            <!-- Flash Alert Box -->
            <div id="alertBox" class="hidden mb-4 p-3 rounded-lg text-sm font-semibold border-2 transition-all"></div>

            <form class="space-y-4 sm:space-y-5" id="loginForm">
                <div class="space-y-1.5">
                    <label class="block font-bold text-earth-dark text-sm" for="username">Username atau Email</label>
                    <div class="relative">
                        <input class="w-full h-11 sm:h-12 px-4 input-cardboard rounded-lg text-sm transition-soft"
                            id="username" name="username" placeholder="Email atau username" type="text"
                            autocomplete="username" required>
                    </div>
                </div>

                <div class="space-y-1.5">
                    <div class="flex justify-between items-center">
                        <label class="block font-bold text-earth-dark text-sm" for="password">Kata Sandi</label>
                        <!-- Lupa kata sandi telah dihapus sesuai instruksi user -->
                    </div>
                    <div class="relative">
                        <input class="w-full h-11 sm:h-12 px-4 input-cardboard rounded-lg text-sm transition-soft pr-10"
                            id="password" name="password" placeholder="••••••••" type="password"
                            autocomplete="current-password" required>
                        <button class="absolute right-3 top-1/2 -translate-y-1/2 text-text-muted hover:text-earth-dark transition-colors"
                            onclick="togglePassword()" type="button" aria-label="Toggle password visibility">
                            <svg class="text-xl w-6 h-6 flex-shrink-0 object-contain" id="passwordIcon" xmlns="http://www.w3.org/2000/svg" fill="currentColor" aria-label="eye" viewBox="0 0 170 101"><path d="M75 6C52.8 9 36.5 17.5 18.3 35.7 5.6 48.4 5.5 48.8 13.8 59.2a97 97 0 0 0 52.8 34.9c7.9 1.9 27.6 1.4 36.6-1a108 108 0 0 0 27.9-12.3c13.4-8.6 30.9-27 30.9-32.5 0-3.1-8-12.4-16.9-19.7-8-6.6-19.4-13.4-28.1-16.9A101 101 0 0 0 75 6m30.5 7a96 96 0 0 1 51 34.1c.8 2.5-.9 5.2-9.1 13.9-27 28.6-64 37.6-95.1 23a88 88 0 0 1-33.4-25.8c-3.3-4-5.9-8.1-5.9-9.1 0-2.5 18.1-19.7 26.9-25.5A82 82 0 0 1 105.5 13"/><path d="M74.8 23.9a32 32 0 0 0-13.1 9 27.6 27.6 0 0 0 8.9 42.7A29 29 0 0 0 112 49.9c0-15.2-10.8-25.9-27-26.5-4.1-.2-8.7.1-10.2.5m18.7 5.5a22.6 22.6 0 0 1 7 37.1c-5 4.9-10.1 6.9-17.6 7-5.6 0-7.3-.4-11.4-3-2.7-1.7-6.3-5-8-7.4-2.8-3.9-3-4.9-3-12.6s.2-8.7 3-12.7c3.1-4.4 9.3-8.5 14.9-9.9 3.7-.9 11-.2 15.1 1.5"/><path d="M77.5 38.9c-6.8 4.2-9.2 10.9-6.1 16.8C74 60.9 77.6 63 83.6 63c4.7 0 5.9-.4 9-3.3 11.2-10.2-2.3-28.8-15.1-20.8"/></svg>
                        </button>
                    </div>
                </div>

                <button class="btn-primary w-full h-12 text-white font-bold rounded-xl transition-soft text-sm sm:text-base cursor-pointer"
                    type="submit">
                    Masuk Ke Sistem
                </button>
            </form>

            <div class="relative my-6">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t-2 border-dashed border-border-light"></div>
                </div>
                <div class="relative flex justify-center text-xs">
                    <span class="px-3 bg-card-bg text-earth-dark font-bold">Atau Akses Darurat (1 Jam / OTP)</span>
                </div>
            </div>

            <div class="space-y-3">
                <button class="btn-secondary w-full flex items-center justify-between p-3.5 rounded-xl transition-soft cursor-pointer"
                    onclick="toggleEmergency()" type="button" id="emergencyToggleBtn">
                    <div class="flex items-center gap-2.5">
                        <svg class="text-accent text-2xl w-6 h-6 flex-shrink-0 object-contain"  xmlns="http://www.w3.org/2000/svg" fill="currentColor" aria-label="shield" viewBox="0 0 131 172"><path d="M59 11.6C46.2 20 22.5 29 13.4 29c-1.3 0-3.3.9-4.3 1.9-1.6 1.6-2 4.1-2.6 17.3-2 43.3 6.6 74.3 26.4 95.1 11 11.6 27.9 21.5 34.8 20.4 8.7-1.5 27.4-15.3 37.4-27.7 14.1-17.7 18.8-37.4 19.2-82.2.2-26.2 1.1-24.6-14.3-27.8a107 107 0 0 1-34.1-13c-4.5-2.8-8.9-5-9.8-5S62 9.7 59 11.6m16.6 6.3A115 115 0 0 0 109 30.6c4.7.9 9.1 2.2 9.8 2.7.9.7 1.2 5.5 1.2 17.6 0 33.9-3.2 54.7-10.6 69.7a85 85 0 0 1-35.8 35.5l-7.8 4.1-7.2-3.6q-39.9-20-46.6-73.1c-1.2-9.1-1.1-47.8.1-49 .3-.3 3.2-1 6.5-1.6 12.5-2.2 30.3-9.4 42.9-17.3 2.2-1.4 4.3-2.6 4.7-2.6s4.7 2.2 9.4 4.9"/></svg>
                        <span class="font-bold text-earth-dark text-sm sm:text-base">Login Darurat Via OTP</span>
                    </div>
                    <span class="material-symbols-outlined text-earth-dark transition-transform duration-300"
                        id="emergencyChevron">expand_more</span>
                </button>

                <div class="space-y-3 hidden bg-[#FFF8F0] p-4 rounded-xl border-2 border-dashed border-border-light" id="emergencySection">
                    <p class="text-xs text-text-muted font-medium leading-relaxed">
                        Fitur ini dibatasi <strong>1 kali per 1 jam</strong>. Kode OTP 6-digit akan dikirimkan langsung ke email terdaftar.
                    
                    <button class="btn-secondary w-full py-2.5 px-3 rounded-lg text-xs font-bold flex items-center justify-center gap-2 cursor-pointer"
                        id="requestOtpBtn" onclick="requestOtp()">
                        <svg class="text-base w-6 h-6 flex-shrink-0 object-contain"  xmlns="http://www.w3.org/2000/svg" fill="currentColor" aria-label="send" viewBox="0 0 133 140"><path d="M89 18.2 33.1 38.6c-12.9 4.6-24 8.9-24.8 9.5-.7.6-1.3 2.2-1.3 3.4 0 2.3 4.7 4.5 38.2 18.1l9.7 3.9 4 9L72.4 112c8.6 18.7 9.7 20.5 12.1 20.8 1.5.2 3.1 0 3.6-.5s3.6-9.4 6.8-19.9l18.5-58.9c6.9-22 12.6-41.2 12.6-42.7 0-2.3-2.6-5.2-4.2-4.7zm21.5-.3L82 44.5C62.1 63 56.2 68 54.5 67.6c-1.1-.3-10.8-4.1-21.5-8.5-17.2-7-19.2-8.1-17-8.9l42.5-15.5L105 17.6c8.4-3.2 9.1-3.2 5.5.3m8.5 1.3L101.9 73c-8.8 28.3-16.4 51.8-16.8 52.3-.6.6-11.7-22.4-22.5-46.7l-3-6.8 6.6-5.9c3.7-3.3 17-15.6 29.5-27.4a491 491 0 0 1 23.5-21.4c.4-.1.3.9-.2 2.1"/></svg>
                        <span>Minta Kode OTP Ke Email</span>
                    </button>

                    <div id="otpFormArea" class="hidden space-y-3 pt-2">
                        <label class="block text-xs font-bold text-earth-dark">Masukkan 6-Digit OTP:</label>
                        <div class="otp-container flex gap-1.5 justify-between">
                            <input class="otp-input w-10 h-11 text-center rounded-lg border-2 border-border-card font-bold text-lg" inputmode="numeric" maxlength="1" type="text" aria-label="Digit 1">
                            <input class="otp-input w-10 h-11 text-center rounded-lg border-2 border-border-card font-bold text-lg" inputmode="numeric" maxlength="1" type="text" aria-label="Digit 2">
                            <input class="otp-input w-10 h-11 text-center rounded-lg border-2 border-border-card font-bold text-lg" inputmode="numeric" maxlength="1" type="text" aria-label="Digit 3">
                            <input class="otp-input w-10 h-11 text-center rounded-lg border-2 border-border-card font-bold text-lg" inputmode="numeric" maxlength="1" type="text" aria-label="Digit 4">
                            <input class="otp-input w-10 h-11 text-center rounded-lg border-2 border-border-card font-bold text-lg" inputmode="numeric" maxlength="1" type="text" aria-label="Digit 5">
                            <input class="otp-input w-10 h-11 text-center rounded-lg border-2 border-border-card font-bold text-lg" inputmode="numeric" maxlength="1" type="text" aria-label="Digit 6">
                        </div>
                        <button class="btn-primary w-full h-11 text-white font-bold rounded-xl transition-soft text-xs sm:text-sm cursor-pointer"
                            type="button" onclick="verifyOtp()">
                            Verifikasi & Masuk
                        </button>
                    </div>
                </div>
            </div>

            <div class="mt-6 pt-4 border-t-2 border-dashed border-border-light text-center">
                <a href="/" class="text-xs text-accent font-bold hover:underline inline-flex items-center gap-1">
                    <svg class="text-sm w-6 h-6 flex-shrink-0 object-contain"  xmlns="http://www.w3.org/2000/svg" fill="currentColor" aria-label="arrow left" viewBox="0 0 144 68"><path d="M29.9 12.7C9.1 30.2 8 31.2 8 34.1c0 2.2 2.7 4.9 16.1 16.3A90 90 0 0 0 42.5 64c2.7 0 4.9-2.4 4.2-4.4-.3-.8-5.8-5.8-12.1-11.1L23 38.6l55.3.2c54.6.4 55.2.4 57-1.6 1.5-1.6 1.6-2.4.7-4.1-1-2-1.9-2.1-23.8-2.2l-56.1-.8-33.5-.6 11.6-9.8c6.4-5.4 11.9-10.4 12.1-11C47.1 6.6 45 4 42.6 4c-1.4 0-6.2 3.3-12.7 8.7"/></svg> Lihat Portofolio Publik
                </a>
            </div>
        </div>
    </main>

    <script src="/js/script-base.js"></script>
    <script src="/js/script-login.js"></script>
</body>

</html>
