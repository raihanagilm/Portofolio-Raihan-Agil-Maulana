<!DOCTYPE html>
<html class="light" lang="id">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=5.0" name="viewport">
    <meta name="description" content="Manajemen Portofolio - Login Page dengan tema kardus">
    <title>Manajemen Portofolio - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=block" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        try {
            tailwind.config = {
                darkMode: "class",
                theme: {
                    extend: {
                        "colors": {
                            "kraft-light": "#F5E6D3",
                            "kraft": "#E8D4B8",
                            "kraft-dark": "#D4B896",
                            "cardboard": "#C9A87C",
                            "cardboard-dark": "#A67C52",
                            "cardboard-darker": "#8B5A3C",
                            "earth-brown": "#5C3214",
                            "earth-dark": "#2C1A0E",
                            "card-bg": "#FFFBF5",
                            "surface": "#FAF0E6",
                            "accent": "#D2691E",
                            "accent-hover": "#B8581A",
                            "on-surface": "#2C1A0E",
                            "on-primary": "#FFFFFF",
                            "border-card": "#8B5A3C",
                            "border-light": "#A67C52",
                            "text-muted": "#6E5033"
                        }
                    }
                }
            }
        } catch (_e) { }
    </script>
    <link rel="stylesheet" href="/css/style-base.css">
    <link rel="stylesheet" href="/css/style-login.css">
</head>

<body class="bg-surface text-earth-dark font-body-md min-h-screen flex flex-col justify-center items-center p-4">
    <main class="w-full max-w-md z-10 my-auto">
        <div class="cardboard-card cardboard-texture rounded-2xl p-6 sm:p-8 shadow-cardboard relative">
            <div class="tape-accent"></div>
            
            <div class="mb-6 text-center">
                <div class="inline-block mb-3">
                    <div class="w-16 h-16 sm:w-20 sm:h-20 bg-gradient-to-br from-cardboard-dark to-cardboard-darker rounded-2xl flex items-center justify-center shadow-md border-2 border-earth-dark">
                        <i class="lucide text-white text-3xl sm:text-4xl" data-lucide="folder-cog"></i>
                    </div>
                </div>
                <h1 class="font-bold text-2xl sm:text-3xl text-earth-dark mb-1">Manajemen Portofolio</h1>
                <p class="text-text-muted text-xs sm:text-sm font-medium">Masuk untuk mengelola portofolio Raihan Agil Maulana.</p>
            </div>

            <!-- Flash Alert Box -->
            <div id="alertBox" class="hidden mb-4 p-3 rounded-lg text-sm font-semibold border-2 transition-all"></div>

            <form class="space-y-4 sm:space-y-5" id="loginForm">
                <div class="space-y-1.5">
                    <label class="block font-bold text-earth-dark text-sm" for="username">Username atau Email</label>
                    <div class="relative">
                        <input class="w-full h-11 sm:h-12 px-4 input-cardboard rounded-lg text-sm transition-soft"
                            id="username" name="username" placeholder="Email atau username" type="text"
                            autocomplete="username" required>
                    </div>
                </div>

                <div class="space-y-1.5">
                    <div class="flex justify-between items-center">
                        <label class="block font-bold text-earth-dark text-sm" for="password">Kata Sandi</label>
                        <!-- Lupa kata sandi telah dihapus sesuai instruksi user -->
                    </div>
                    <div class="relative">
                        <input class="w-full h-11 sm:h-12 px-4 input-cardboard rounded-lg text-sm transition-soft pr-10"
                            id="password" name="password" placeholder="••••••••" type="password"
                            autocomplete="current-password" required>
                        <button class="absolute right-3 top-1/2 -translate-y-1/2 text-text-muted hover:text-earth-dark transition-colors"
                            onclick="togglePassword()" type="button" aria-label="Toggle password visibility">
                            <i class="lucide text-xl" id="passwordIcon" data-lucide="eye"></i>
                        </button>
                    </div>
                </div>

                <button class="btn-primary w-full h-12 text-white font-bold rounded-xl transition-soft text-sm sm:text-base cursor-pointer"
                    type="submit">
                    Masuk Ke Sistem
                </button>
            </form>

            <div class="relative my-6">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t-2 border-dashed border-border-light"></div>
                </div>
                <div class="relative flex justify-center text-xs">
                    <span class="px-3 bg-card-bg text-earth-dark font-bold">Atau Akses Darurat (1 Jam / OTP)</span>
                </div>
            </div>

            <div class="space-y-3">
                <button class="btn-secondary w-full flex items-center justify-between p-3.5 rounded-xl transition-soft cursor-pointer"
                    onclick="toggleEmergency()" type="button" id="emergencyToggleBtn">
                    <div class="flex items-center gap-2.5">
                        <i class="lucide text-accent text-2xl" data-lucide="shield"></i>
                        <span class="font-bold text-earth-dark text-sm sm:text-base">Login Darurat Via OTP</span>
                    </div>
                    <span class="material-symbols-outlined text-earth-dark transition-transform duration-300"
                        id="emergencyChevron">expand_more</span>
                </button>

                <div class="space-y-3 hidden bg-[#FFF8F0] p-4 rounded-xl border-2 border-dashed border-border-light" id="emergencySection">
                    <p class="text-xs text-text-muted font-medium leading-relaxed">
                        Fitur ini dibatasi <strong>1 kali per 1 jam</strong>. Kode OTP 6-digit akan dikirimkan langsung ke email terdaftar.
                    
                    <button class="btn-secondary w-full py-2.5 px-3 rounded-lg text-xs font-bold flex items-center justify-center gap-2 cursor-pointer"
                        id="requestOtpBtn" onclick="requestOtp()">
                        <i class="lucide text-base" data-lucide="send"></i>
                        <span>Minta Kode OTP Ke Email</span>
                    </button>

                    <div id="otpFormArea" class="hidden space-y-3 pt-2">
                        <label class="block text-xs font-bold text-earth-dark">Masukkan 6-Digit OTP:</label>
                        <div class="otp-container flex gap-1.5 justify-between">
                            <input class="otp-input w-10 h-11 text-center rounded-lg border-2 border-border-card font-bold text-lg" inputmode="numeric" maxlength="1" type="text" aria-label="Digit 1">
                            <input class="otp-input w-10 h-11 text-center rounded-lg border-2 border-border-card font-bold text-lg" inputmode="numeric" maxlength="1" type="text" aria-label="Digit 2">
                            <input class="otp-input w-10 h-11 text-center rounded-lg border-2 border-border-card font-bold text-lg" inputmode="numeric" maxlength="1" type="text" aria-label="Digit 3">
                            <input class="otp-input w-10 h-11 text-center rounded-lg border-2 border-border-card font-bold text-lg" inputmode="numeric" maxlength="1" type="text" aria-label="Digit 4">
                            <input class="otp-input w-10 h-11 text-center rounded-lg border-2 border-border-card font-bold text-lg" inputmode="numeric" maxlength="1" type="text" aria-label="Digit 5">
                            <input class="otp-input w-10 h-11 text-center rounded-lg border-2 border-border-card font-bold text-lg" inputmode="numeric" maxlength="1" type="text" aria-label="Digit 6">
                        </div>
                        <button class="btn-primary w-full h-11 text-white font-bold rounded-xl transition-soft text-xs sm:text-sm cursor-pointer"
                            type="button" onclick="verifyOtp()">
                            Verifikasi & Masuk
                        </button>
                    </div>
                </div>
            </div>

            <div class="mt-6 pt-4 border-t-2 border-dashed border-border-light text-center">
                <a href="/" class="text-xs text-accent font-bold hover:underline inline-flex items-center gap-1">
                    <i class="lucide text-sm" data-lucide="arrow-left"></i> Lihat Portofolio Publik
                </a>
            </div>
        </div>
    </main>

    <script src="/js/script-base.js"></script>
    <script src="/js/script-login.js"></script>
</body>

</html>
